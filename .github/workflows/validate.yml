name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi (macOS)
        if: runner.os == 'macOS'
        run: brew install chezmoi
      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        env:
          # renovate: datasource=github-releases depName=twpayne/chezmoi
          CHEZMOI_VERSION: v2.74.1
        run: |
          ver="${CHEZMOI_VERSION#v}"
          deb="chezmoi_${ver}_linux_amd64.deb"
          curl -fsSLo "/tmp/${deb}" "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/${deb}"
          curl -fsSL "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${ver}_checksums.txt" \
            | awk -v f="$deb" '$2 == f { print $1 "  /tmp/" f }' \
            | sha256sum -c -
          sudo dpkg -i "/tmp/${deb}"
      - name: Lint packages
        run: sh .github/scripts/lint-packages.sh
      - name: Dry run chezmoi
        run: |
          chezmoi init --promptDefaults -S .
          chezmoi apply -S . -n
